[workspace]
resolver = "2"
members = ["znicz-core", "znicz-library", "znicz-tui", "znicz-mcp", "znicz"]

[workspace.package]
version = "0.4.7"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Eugene"]
rust-version = "1.85"

[workspace.dependencies]
ureq = "3"
symphonia = { version = "0.5", features = ["all"] }
cpal = "0.15"
rtrb = "0.3"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
ratatui = "0.30"
crossterm = "0.28"
color-eyre = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
rmcp = { version = "0.3", features = ["server", "transport-io"] }
schemars = { version = "1.2", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
lofty = "0.25"
# `bundled` compiles SQLite from source so Linux and Windows builds do not need
# a system SQLite installed.
rusqlite = { version = "0.40", features = ["bundled"] }
walkdir = "2.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ratatui-image = { version = "11", default-features = false, features = ["image-defaults", "crossterm"] }

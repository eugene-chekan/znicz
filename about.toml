# cargo-about: generates THIRD-PARTY-LICENSES.html for release archives.
# Regenerate with scripts/third-party-licenses.sh after dependency changes.

# Only what ships in the binary, for the platforms we release.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true
# Our own crates are covered by LICENSE-MIT / LICENSE-APACHE.
private = { ignore = true }

# Licences we accept, in order of preference when a crate offers a choice.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "WTFPL",
]
